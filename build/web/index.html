<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Flutter Project">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="petlar_flutter_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="faviconico.ico"/>

  <title>Petlar</title>
  <link rel="manifest" href="manifest.json">

  <style>
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      z-index: 9999;
      flex-direction: column;
    }

    /* Barra de progresso */
    .loading-bar {
      width: 80%;
      max-width: 300px;
      height: 8px;
      background: #ddd;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 15px;
    }

    .loading-bar-fill {
      width: 0%;
      height: 100%;
      background: #4CAF50;
      animation: loading 2s infinite;
    }

    @keyframes loading {
      0% { width: 0%; }
      50% { width: 100%; }
      100% { width: 0%; }
    }
  </style>
</head>
<body>
  <!-- Tela de carregamento -->
  <div id="loading-screen">
    <img src="favicon.png" alt="logo" width="72">
    <div class="loading-bar">
      <div class="loading-bar-fill"></div>
    </div>
  </div>

  <script src="flutter_bootstrap.js" async></script>

  <script>
    // Quando o Flutter terminar de carregar, remove a tela de loading
    window.addEventListener('flutter-first-frame', function () {
      document.getElementById('loading-screen').style.display = 'none';
    });
  </script>
</body>
</html>
